<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>천보금 입양 — 가족을 기다리는 아이들</title>
<meta name="description" content="천보금 유기견 보호소의 아이들을 방별로 만나보세요. 증명사진과 함께 가족을 기다리는 아이들을 소개합니다.">
<meta name="theme-color" content="#F3F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131711" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:site_name" content="천보금 입양">
<meta property="og:title" content="천보금 입양">
<meta property="og:description" content="가족을 기다리는 아이들을 방별로 만나보세요.">
<meta property="og:url" content="https://ggong162212-commits.github.io/Adoption/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css">
<script>
  // 저장된 테마를 그리기 전에 적용해 첫 화면 깜빡임을 막는다
  try {
    var t = localStorage.getItem('adoption.theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  .faces .face svg { width: 14px; height: 14px; }
  main { padding: 4px 14px calc(48px + var(--safe-bottom)); }

  /* 첫 문장 — 숫자를 대시보드가 아니라 문장으로 읽힌다 */
  .lead {
    font-family: var(--display); font-weight: 500;
    font-size: 17px; line-height: 1.55; letter-spacing: -0.02em;
    color: var(--ink-2); padding: 10px 2px 16px;
    text-wrap: balance;
  }
  .lead b { font-weight: 700; color: var(--ink); font-size: 20px; }
  .lead .accent { color: var(--accent); }

  .notice {
    display: flex; gap: 9px; align-items: flex-start;
    background: var(--honey-soft); border: 1px solid color-mix(in srgb, var(--honey) 26%, transparent);
    color: color-mix(in srgb, var(--honey) 78%, var(--ink));
    border-radius: var(--r-sm); padding: 11px 13px;
    font-size: 13px; line-height: 1.6; font-weight: 500; margin-bottom: 14px;
  }
  .notice svg { width: 16px; height: 16px; flex: none; margin-top: 2px; }

  /* 방 카드 — 폴더 목록이 아니라 '누가 사는 방'으로 읽히게 */
  .room-list { display: grid; gap: 9px; }
  .room-card {
    position: relative; width: 100%; text-align: left;
    display: flex; align-items: center; gap: 13px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); padding: 13px 14px 13px 17px;
    box-shadow: var(--shadow-1); overflow: hidden;
    transition: transform .16s cubic-bezier(.32,.72,0,1), box-shadow .16s, border-color .16s;
  }
  .room-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: var(--room-color, var(--accent));
  }
  .room-card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .room-card:active { transform: scale(.99); }
  .room-card.is-empty { opacity: .55; box-shadow: none; }

  .room-card .glyph {
    width: 40px; height: 40px; flex: none; border-radius: 12px;
    display: grid; place-items: center; font-size: 19px; line-height: 1;
    background: color-mix(in srgb, var(--room-color, var(--accent)) 15%, var(--surface));
  }
  .room-card .body { flex: 1; min-width: 0; display: block; }
  .room-card .name {
    display: block;
    font-family: var(--display); font-weight: 600; font-size: 17px;
    letter-spacing: -0.02em; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .room-card .count {
    display: block; margin-top: 1px;
    font-size: 12px; color: var(--ink-3); font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .room-card .faces { flex: none; }

  /* 강아지 그리드 */
  .dog-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 11px; }
  @media (min-width: 480px) { .dog-grid { grid-template-columns: repeat(3, 1fr); } }

  .crumb {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 2px 14px;
  }
  .crumb .glyph {
    width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    font-size: 15px; background: color-mix(in srgb, var(--room-color, var(--accent)) 16%, var(--surface));
  }
  .crumb .t { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: -0.02em; }
  .crumb .n { font-size: 12.5px; color: var(--ink-3); font-weight: 500; font-variant-numeric: tabular-nums; }

  .filterline {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; font-weight: 500; color: var(--ink-2);
    padding: 0 2px 12px; cursor: pointer;
  }
  .filterline input { width: 17px; height: 17px; accent-color: var(--accent); }

  /* 상세 시트 */
  .sheet-backdrop {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(16, 20, 14, .5);
    opacity: 0; transition: opacity .24s;
  }
  .sheet-backdrop.show { opacity: 1; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    box-shadow: var(--shadow-sheet);
    max-height: 93vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    transform: translateY(100%); transition: transform .3s cubic-bezier(.32,.72,0,1);
    padding-bottom: calc(22px + var(--safe-bottom));
  }
  .sheet.show { transform: translateY(0); }
  .sheet-inner { max-width: 560px; margin: 0 auto; padding: 0 18px; }
  .grabber { width: 38px; height: 4px; border-radius: 99px; background: var(--line-2); margin: 10px auto 4px; }

  .detail-photo {
    aspect-ratio: 3/4; width: min(100%, 260px); margin: 8px auto 18px;
    border-radius: 18px; overflow: hidden; background: var(--ground-2);
    box-shadow: var(--shadow-2);
  }
  .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
  .detail-photo .placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: var(--ink-3); }
  .detail-photo .placeholder svg { width: 54px; height: 54px; }

  .detail-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; margin-bottom: 4px; }
  .detail-head h2 { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -0.03em; }
  .detail-sub { font-size: 13.5px; color: var(--ink-3); font-weight: 500; margin-bottom: 16px; }

  .facts { display: grid; gap: 1px; background: var(--line); border-radius: var(--r-sm); overflow: hidden; margin-bottom: 15px; }
  .fact { display: flex; padding: 11px 13px; font-size: 14px; background: var(--surface-2); }
  .fact dt { width: 76px; flex: none; color: var(--ink-3); font-weight: 500; font-size: 13px; }
  .fact dd { flex: 1; font-weight: 500; }

  .note-box {
    border-left: 2px solid var(--accent-line);
    padding: 2px 0 2px 14px; margin-bottom: 20px;
    font-size: 14.5px; line-height: 1.75; color: var(--ink-2);
    white-space: pre-wrap;
  }
  .sheet-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sheet-actions .span2 { grid-column: 1 / -1; }

  .foot {
    text-align: center; padding: 30px 16px calc(24px + var(--safe-bottom));
    color: var(--ink-3); font-size: 12px; line-height: 1.8;
  }
  .foot .mark { font-family: var(--display); font-weight: 600; font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <button id="backBtn" class="icon-btn" hidden aria-label="뒤로"></button>
    <div class="brand">
      <h1 id="pageTitle">천보금 입양</h1>
      <div class="sub" id="pageSub">가족을 기다리는 아이들</div>
    </div>
    <button id="searchBtn" class="icon-btn" aria-label="이름으로 찾기"></button>
    <button id="themeBtn" class="icon-btn" aria-label="화면 밝기 전환"></button>
  </div>

  <div class="wrap" style="padding: 0 14px">
    <div class="searchwrap" id="searchwrap" hidden>
      <input id="searchInput" class="input" type="search" placeholder="이름으로 찾기" autocomplete="off">
    </div>
    <div class="segmented" id="viewSeg" data-index="0" role="tablist" aria-label="보기 방식">
      <span class="thumb"></span>
      <button role="tab" data-view="all" aria-selected="true">전체 보기</button>
      <button role="tab" data-view="rooms" aria-selected="false">방별 보기</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="content"></div>
</main>

<footer class="foot">
  <div class="mark">천보금 유기견 보호소</div>
  <span id="footContact"></span>
</footer>

<div id="backdrop" class="sheet-backdrop" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="강아지 상세" hidden>
  <div class="grabber"></div>
  <div class="sheet-inner" id="sheetBody"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="assets/icons.js"></script>
<script src="assets/idcard.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
